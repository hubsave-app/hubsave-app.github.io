<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="100%" height="100%">
  <rect width="400" height="800" fill="#0a0a0a" rx="20"/>
  
  <!-- App Header -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fe2c55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b25f4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="400" height="220" fill="url(#grad1)" rx="20"/>
  <!-- Status bar -->
  <text x="360" y="40" fill="#fff" font-family="Arial" font-size="14" text-anchor="end">11:21</text>
  
  <!-- Settings Icon -->
  <circle cx="50" cy="90" r="12" fill="#fff" opacity="0.9"/>
  <!-- App Title -->
  <text x="360" y="100" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="end">HubSave</text>
  
  <!-- Paste Card -->
  <rect x="20" y="160" width="360" height="240" fill="#111" rx="20" stroke="#1e1e1e" stroke-width="2"/>
  
  <!-- Input Box -->
  <text x="340" y="195" fill="#888" font-family="Arial, sans-serif" font-size="14" text-anchor="end">ألصق رابط الفيديو هنا...</text>
  <rect x="40" y="210" width="320" height="80" fill="#1a1a1a" rx="12" stroke="#444" stroke-width="1"/>
  <rect x="60" y="235" width="18" height="26" fill="none" stroke="#888" stroke-width="2" rx="2"/> 
  <rect x="64" y="230" width="10" height="6" fill="#888" rx="1"/> <!-- Clipboard -->
  <text x="100" y="245" fill="#fff" font-family="Arial, sans-serif" font-size="16">https://example.com/</text>
  <text x="100" y="270" fill="#fff" font-family="Arial, sans-serif" font-size="16">video/123456789...</text>
  
  <!-- Button Check -->
  <rect x="40" y="320" width="320" height="60" fill="#fe2c55" rx="15"/>
  <text x="200" y="357" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">فحص الرابط</text>
  
  <!-- Pointer -->
  <circle cx="200" cy="350" r="100" fill="none" stroke="#fe2c55" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="350" r="80" fill="none" stroke="#fe2c55" stroke-width="2" opacity="0.5"/>
</svg>